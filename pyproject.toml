[tool.briefcase]
project_name = "AayDocCapio"
bundle = "com.aaydoccapio"
version = "2.4.1"
url = "https://download.aaydoccapio.com/"
license = "AGPL-3.0-or-later"
author = "Deepak Bholusaria"
author_email = "deepak@bholusaria.com"

[tool.briefcase.app.aaydoccapio]
formal_name = "AayDocCapio"
description = "ITD Bulk Document Downloader (Form 26AS, AIS, TIS)"
icon = "resources/icon"
sources = [
    "automation",
    "vault.py",
    "assessment_years.json",
    "tax_vault.json",
]
requires = [
    "PyQt6",
    "pandas",
    "openpyxl",
    "xlsxwriter",
    "playwright",
    "cryptography",
]

# Entry point — Briefcase calls main() in the app module
[tool.briefcase.app.aaydoccapio.sources]

[tool.briefcase.app.aaydoccapio.windows]
requires = [
    "PyQt6",
    "pandas",
    "openpyxl",
    "xlsxwriter",
    "playwright",
    "cryptography",
]

# To build:
#   pip install briefcase
#   briefcase create windows
#   briefcase build windows       # produces MSI in dist/
#   briefcase run windows         # test locally
